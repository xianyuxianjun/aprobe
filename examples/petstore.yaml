openapi: 3.0.3
info:
  title: Petstore Baseline
  version: 1.0.0
  description: aprobe 的评估基准规范。与 mock/mock_service.py 的 conformant 场景一一对应。
paths:
  /health:
    get:
      operationId: getHealth
      summary: 健康检查
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /pets:
    get:
      operationId: listPets
      summary: 列出全部宠物
      responses:
        "200":
          description: 宠物列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
    post:
      operationId: createPet
      summary: 创建宠物
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "422":
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /pets/stats:
    get:
      operationId: getPetStats
      summary: 宠物统计
      responses:
        "200":
          description: 统计结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetStats"

  /pets/{petId}:
    get:
      operationId: getPetById
      summary: 按 id 查询宠物
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 宠物详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /pets/{petId}/owners:
    get:
      operationId: getPetOwner
      summary: 查询宠物主人（需要鉴权）
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 主人信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "401":
          description: 缺少凭据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
      additionalProperties: false

    Owner:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        token:
          type: string

    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
          minLength: 1
        owner:
          $ref: "#/components/schemas/Owner"

    Pets:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
        total:
          type: integer
          minimum: 0

    PetStats:
      type: object
      required: [total, as_of]
      properties:
        total:
          type: integer
          minimum: 0
        as_of:
          type: string
          format: date-time

    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

name: ci

on:
  push:
  pull_request:

jobs:
  # ADR-0003 的可执行形式：没有模型、也没有可选依赖时，降级路径必须完整可用
  degraded-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 只装核心依赖
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev]'
      - name: 降级路径必须全绿（需要循环的用例应被跳过而不是失败）
        run: .venv/bin/pytest

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装
        run: |
          uv venv --python 3.12
          uv pip install -e '.[dev,agent]'

      - name: 单元与集成测试
        run: .venv/bin/pytest

      - name: 静态检查（仅 pyflakes 级别：未定义名、未使用导入/变量）
        run: uvx ruff check src tests mock --select F

      - name: 在评估基准上回放全部样例集
        run: bash scripts/evaluate_all.sh

      - name: 归档评估结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: reports/
          if-no-files-found: warn

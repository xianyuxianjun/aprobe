version: 1
cases:
- id: get-broken-json
  operation_id: getBrokenJson
  summary: 声明为 application/json，用来观察"响应不是 JSON"时的结论
  request:
    method: GET
    path: /contracts/broken-json
    path_values: {}
    query: {}
    headers: {}
  assertions:
  - kind: status
    in:
    - 200
  - kind: json_schema
    response: '200'
  requires: []
  write: false
  origin: deterministic
- id: get-empty-list
  operation_id: getEmptyList
  summary: 空列表（item 条数为 0）
  request:
    method: GET
    path: /contracts/empty
    path_values: {}
    query: {}
    headers: {}
  assertions:
  - kind: status
    in:
    - 200
  - kind: json_schema
    response: '200'
  requires: []
  write: false
  origin: deterministic
- id: get-enum-field
  operation_id: getEnumField
  summary: 枚举取值
  request:
    method: GET
    path: /contracts/enum
    path_values: {}
    query: {}
    headers: {}
  assertions:
  - kind: status
    in:
    - 200
  - kind: json_schema
    response: '200'
  requires: []
  write: false
  origin: deterministic
- id: get-nested-object
  operation_id: getNestedObject
  summary: 嵌套对象与数组元素类型
  request:
    method: GET
    path: /contracts/nested
    path_values: {}

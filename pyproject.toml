[project]
name = "aprobe"
version = "0.0.1"
description = "Bounded autonomous OpenAPI contract testing agent"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]
dev = [
    "pytest>=8.3",
]

[project.scripts]
aprobe = "aprobe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "mock"]
addopts = "-q"
